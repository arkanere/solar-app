# Postgres for the integration test suite (Phase 5.5 of the Drizzle migration).
#
# Not used by `npm run dev` — the apps still point at the real database via
# their own .env.local. This exists purely so tests can run against real
# Postgres, which is the whole point: the risk being guarded is the SQL.
#
#   docker compose -f docker-compose.test.yml up -d
#   npm run test -w solarvipani-business
#
# Port 5433 (not 5432) so it cannot collide with a locally installed Postgres.

services:
  postgres:
    image: postgres:16-alpine
    container_name: solar-test-db
    environment:
      POSTGRES_USER: solar
      POSTGRES_PASSWORD: solar
      POSTGRES_DB: solar_test
    ports:
      - '5433:5432'
    # Data lives in a tmpfs: the suite recreates the schema on every run, so
    # persistence buys nothing and costs a stale-schema failure mode.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U solar -d solar_test']
      interval: 2s
      timeout: 3s
      retries: 15
